<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="theme-color" content="#313bac" />

    <!-- Same pre-paint theme restore as index.html. Duplicated rather than
         imported because it has to run before any bundle loads, and a case
         study opened from a shared link is often someone's first page. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {
        /* Private mode can throw on storage access; the CSS default still applies. */
      }
    </script>

    <title>Running AI on my own hardware | Miguel Vilhena</title>
    <meta
      name="description"
      content="An agent is only worth having if you can leave it alone, and you can only leave it alone if the models are good enough and the boundaries are real. How I measured the first, enforced the second on hardware I own, and fixed a bug upstream in the inference server along the way."
    />
    <link rel="canonical" href="https://miguelvilhena.com/factory" />

    <!-- Static for the same reason as index.html: unfurlers do not run JS, and
         this page exists to be shared. -->
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://miguelvilhena.com/factory" />
    <meta property="og:site_name" content="Miguel Vilhena" />
    <meta property="og:title" content="The model wrote code that looked right." />
    <meta
      property="og:description"
      content="An agent is only worth having if you can leave it alone. Choosing models by measurement rather than by blog post, building one that cannot push rather than one told not to, and a patch merged upstream."
    />
    <meta property="og:image" content="https://miguelvilhena.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The model wrote code that looked right." />
    <meta
      name="twitter:description"
      content="Running local models on hardware I own: measured model selection, an agent that structurally cannot push, and a patch merged upstream."
    />
    <meta name="twitter:image" content="https://miguelvilhena.com/og.png" />
  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
