<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#313bac" />

    <!--
      Applies a stored theme before the first paint. Without this, the document
      renders light, React mounts, and the page flashes to dark - the one piece
      of theming that genuinely cannot wait for the bundle.

      Only an explicitly stored choice is applied. Leaving the attribute absent
      is what lets the `prefers-color-scheme` media query in the CSS take over,
      so the OS default works with no JavaScript at all.
    -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {
        /* Private mode can throw on storage access; the CSS default still applies. */
      }
    </script>

    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.sanity.io" />

    <!--
      The hero portrait is both the fallback image and the source the particle
      effect samples, so nothing in the hero can happen until it has decoded.
      Without this it is only discoverable after React has booted and rendered,
      which cost 1.7s of load delay on mobile when the old photo was the LCP
      element. `imagesrcset` lets the browser pick the same source the <picture>
      element would. Only AVIF is preloaded: browsers that don't support it
      ignore the hint and fall back to the <picture> element normally.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/hero/portrait-420.avif"
      imagesrcset="/hero/portrait-420.avif 420w, /hero/portrait-840.avif 840w"
      imagesizes="(max-width: 1200px) 70vw, 440px"
      fetchpriority="high"
    />

    <title>Miguel Vilhena | Frontend engineer building product platforms at scale</title>
    <meta
      name="description"
      content="Frontend engineer, fullstack when it counts. I took an IKEA rewards platform from one country to thirty, for 157 million members, and I build with AI daily. Open to permanent roles and freelance work."
    />
    <link rel="canonical" href="https://miguelvilhena.com/" />

    <!--
      Written statically rather than through a Helmet-style runtime.
      Link unfurlers on LinkedIn, WhatsApp and Slack read the HTML as served and
      do not execute JavaScript, so meta tags rendered by React are invisible to
      exactly the audience this section exists for. Driving these from Sanity
      would look tidier in the codebase and would not work.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://miguelvilhena.com/" />
    <meta property="og:site_name" content="Miguel Vilhena" />
    <meta property="og:title" content="Miguel Vilhena | Frontend engineer building product platforms at scale" />
    <meta
      property="og:description"
      content="I take products from a blank page to 30 countries. Frontend engineer, fullstack when it counts, deep in AI."
    />
    <meta property="og:image" content="https://miguelvilhena.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Miguel Vilhena, frontend engineer. I take products from a blank page to 30 countries."
    />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Miguel Vilhena | Frontend engineer building product platforms at scale" />
    <meta
      name="twitter:description"
      content="I take products from a blank page to 30 countries. Frontend engineer, fullstack when it counts, deep in AI."
    />
    <meta name="twitter:image" content="https://miguelvilhena.com/og.png" />

    <!--
      Person and WebSite, so a search result can carry the job title and the
      social profiles rather than a bare link. The LinkedIn URL is duplicated
      from `useSiteSettings.ts`; if it ever changes, change it in both places.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://miguelvilhena.com/#miguel",
            "name": "Miguel Vilhena",
            "url": "https://miguelvilhena.com/",
            "image": "https://miguelvilhena.com/hero/portrait-840.png",
            "jobTitle": "Frontend Engineer",
            "description": "Frontend engineer, fullstack when it counts, who builds product platforms at scale and works deeply with AI.",
            "knowsAbout": [
              "Frontend engineering",
              "React",
              "TypeScript",
              "Node.js",
              "Design systems",
              "Web performance",
              "Google Cloud Platform",
              "Artificial intelligence"
            ],
            "sameAs": [
              "https://www.linkedin.com/in/mvmories/",
              "https://github.com/mvmories"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://miguelvilhena.com/#website",
            "url": "https://miguelvilhena.com/",
            "name": "Miguel Vilhena",
            "inLanguage": "en-GB",
            "publisher": { "@id": "https://miguelvilhena.com/#miguel" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
