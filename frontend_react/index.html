<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#313bac" />

    <!--
      Applies a stored theme before the first paint. Without this, the document
      renders light, React mounts, and the page flashes to dark - the one piece
      of theming that genuinely cannot wait for the bundle.

      Only an explicitly stored choice is applied. Leaving the attribute absent
      is what lets the `prefers-color-scheme` media query in the CSS take over,
      so the OS default works with no JavaScript at all.
    -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {
        /* Private mode can throw on storage access; the CSS default still applies. */
      }
    </script>

    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.sanity.io" />

    <!--
      The hero portrait is both the fallback image and the source the particle
      effect samples, so nothing in the hero can happen until it has decoded.
      Without this it is only discoverable after React has booted and rendered,
      which cost 1.7s of load delay on mobile when the old photo was the LCP
      element. `imagesrcset` lets the browser pick the same source the <picture>
      element would. Only AVIF is preloaded: browsers that don't support it
      ignore the hint and fall back to the <picture> element normally.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/hero/portrait-420.avif"
      imagesrcset="/hero/portrait-420.avif 420w, /hero/portrait-840.avif 840w"
      imagesizes="(max-width: 1200px) 70vw, 440px"
      fetchpriority="high"
    />

    <title>Miguel Vilhena</title>
    <meta name="description" content="Portfolio of Miguel Vilhena — Software Engineer & Entrepreneur." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
