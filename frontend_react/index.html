<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#313bac" />

    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.sanity.io" />

    <!--
      The hero photo is the Largest Contentful Paint element. Without this it is
      only discoverable after React has booted and rendered, which cost 1.7s of
      load delay on mobile. `imagesrcset` lets the browser pick the same source
      the <picture> element would, so a phone preloads 14 kB rather than 19.
      Only AVIF is preloaded: browsers that don't support it ignore the hint and
      fall back to the <picture> element normally.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/hero/profile-617.avif"
      imagesrcset="/hero/profile-400.avif 400w, /hero/profile-617.avif 617w"
      imagesizes="(max-width: 900px) 60vw, 500px"
      fetchpriority="high"
    />

    <title>Miguel Vilhena</title>
    <meta name="description" content="Portfolio of Miguel Vilhena — Software Engineer & Entrepreneur." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
