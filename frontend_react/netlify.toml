# Netlify configuration.
#
# This file lives in frontend_react/ rather than the repo root because the
# Netlify Vite plugin resolves `base` relative to Vite's working directory,
# so a root-level config with base = "frontend_react" resolves to
# frontend_react/frontend_react and breaks local dev.
#
# Requires "Base directory: frontend_react" in the Netlify UI — Netlify then
# reads this file from there.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # Netlify's secrets scanner flags any environment-variable *value* it finds in
  # the build output. These three are deliberately public: the contact address
  # is where the form delivers, the from address appears in every email sent,
  # and the site URL is the site itself, so their presence is expected. The
  # contact address is no longer rendered anywhere on the page; see P3-G.
  #
  # Scoped to keys rather than paths on purpose: SECRETS_SCAN_OMIT_PATHS would
  # blind the scanner to entire files, and disabling it outright would stop it
  # catching RESEND_API_KEY, which is the one value that must never ship.
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_TO_EMAIL,CONTACT_FROM_EMAIL,SITE_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Functions declare their own routes via `export const config = { path }`,
# so /api/* needs no redirect here.

# SPA fallback. Must come last so it cannot shadow function routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Vite fingerprints these filenames, so they are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The hero images live in public/ so index.html can preload a path known before
# the build assigns content hashes. That costs us fingerprinting, so they get a
# day of caching plus revalidation rather than "immutable" — long enough to be
# free on repeat visits, short enough that replacing the photo is not permanent.
[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The social card is fetched by link unfurlers, which cache aggressively and by
# URL. A day of caching keeps repeat scrapes cheap without making a corrected
# card permanently stuck in Slack and WhatsApp previews.
[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
